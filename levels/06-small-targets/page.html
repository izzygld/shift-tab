<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RSVP · Commons</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #1f2328; background: #ffffff; line-height: 1.5; }
      header { padding: 1rem 1.5rem; background: #f6f8fa; border-bottom: 1px solid #d1d9e0; }
      .site-name { font-weight: 700; color: #1f2328; }
      main { padding: 1.5rem; max-width: 32rem; }
      .label { margin: 1.25rem 0 0.5rem; font-weight: 600; }
      .row { display: flex; align-items: center; gap: 1rem; }
      .stepper { display: flex; gap: 2px; }
      .stepper button { width: 18px; height: 18px; padding: 0; font-size: 0.75rem; line-height: 1; }
      .stepper button { border: 1px solid #59636e; border-radius: 4px; background: #fff; color: #1f2328; cursor: pointer; }
      #guests { font-size: 1.25rem; font-weight: 700; }
      .drag-track { position: relative; height: 6px; margin: 1.25rem 0.5rem; background: #d1d9e0; border-radius: 3px; }
      .drag-handle { position: absolute; left: 25%; top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); border-radius: 50%; background: #0a3069; cursor: grab; touch-action: none; }
      input[type="range"] { display: block; width: 100%; height: 2.75rem; accent-color: #0a3069; }
      .cta { margin-top: 1.5rem; padding: 0.65rem 1.25rem; border: 0; border-radius: 6px; font: inherit; color: #fff; background: #1a7f37; cursor: pointer; }
      #status { font-weight: 600; color: #1a7f37; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>
      <a class="site-name" href="#home">Commons Community Center</a>
    </header>
    <main>
      <h1>RSVP for Friday</h1>
      <p class="label" id="guests-label">Guests</p>
      <div class="row" role="group" aria-labelledby="guests-label">
        <div class="stepper">
          <button type="button" aria-label="Fewer guests" onclick="changeGuests(-1)">−</button>
          <button type="button" aria-label="More guests" onclick="changeGuests(1)">+</button>
        </div>
        <output id="guests" aria-live="polite">1</output>
      </div>
      <p class="label" id="arrival-label">Arrival time: <output id="arrival-text">6:00 PM</output></p>
      <div class="drag-track" id="arrival" data-drag><div class="drag-handle"></div></div>
      <button type="button" class="cta" data-goal onclick="save()">Save RSVP</button>
      <p id="status" role="status"></p>
    </main>
    <script>
      let guests = 1;
      let arrivalTime = '6:00 PM';
      const arrival = document.getElementById('arrival');
      const format = (v) => `${Math.floor(v) - 12}:${v % 1 ? '30' : '00'} PM`;

      function changeGuests(delta) {
        guests = Math.min(8, Math.max(1, guests + delta));
        document.getElementById('guests').textContent = guests;
      }
      function setArrival(v) {
        arrivalTime = format(v);
        document.getElementById('arrival-text').textContent = arrivalTime;
        if (arrival.type === 'range') arrival.setAttribute('aria-valuetext', arrivalTime);
      }
      function save() {
        document.getElementById('status').textContent = `Saved: ${guests} guest${guests === 1 ? '' : 's'}, arriving at ${arrivalTime}.`;
      }

      arrival.addEventListener('input', () => setArrival(Number(arrival.value)));

      if (arrival.hasAttribute('data-drag')) {
        const handle = arrival.querySelector('.drag-handle');
        let dragging = false;
        handle.addEventListener('pointerdown', (e) => {
          dragging = true;
          handle.setPointerCapture(e.pointerId);
        });
        handle.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          const box = arrival.getBoundingClientRect();
          const pct = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
          handle.style.left = pct * 100 + '%';
          setArrival(17 + Math.round(pct * 8) / 2);
        });
        handle.addEventListener('pointerup', () => (dragging = false));
      }
    </script>
  </body>
</html>
