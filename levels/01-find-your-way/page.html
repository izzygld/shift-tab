<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Commons Community Center</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #1f2328; background: #ffffff; line-height: 1.5; }
      header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem 1.5rem; background: #f6f8fa; border-bottom: 1px solid #d1d9e0; }
      .site-name { font-weight: 700; font-size: 1.125rem; color: #1f2328; text-decoration: none; }
      nav ul { display: flex; gap: 1rem; list-style: none; margin: 0; padding: 0; }
      nav a { color: #0a3069; }
      main { padding: 1.5rem; max-width: 40rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
      .cta { padding: 0.75rem 1.25rem; border: 0; border-radius: 6px; font-size: 1rem; color: #fff; cursor: pointer; }
      .cta.primary { background: #1a7f37; }
      .cta.alt { background: #0a3069; }
      *:focus { outline: none; }
    </style>
  </head>
  <body>
    <header>
      <a class="site-name" href="#home">Commons Community Center</a>
      <nav aria-label="Main">
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#events">Events</a></li>
          <li><a href="#programs">Programs</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Friday Community Night</h1>
      <p>Join neighbors for dinner, games, and a book swap. We need volunteers to help set up and welcome guests.</p>
      <div class="actions">
        <button class="cta alt" type="button">Donate</button>
        <button class="cta alt" type="button">Share event</button>
        <button class="cta primary" type="button" data-goal>Volunteer</button>
      </div>
    </main>
  </body>
</html>
